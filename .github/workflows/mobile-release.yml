name: Mobile Apps Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — iOS IPA  (macos-14 runner)
  # ─────────────────────────────────────────────────────────────
  build-ios:
    name: 🍎 Build iOS IPA
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[app-build]') ||
      contains(github.event.head_commit.message, '[ios-build]') ||
      contains(github.event.head_commit.message, '[app-update]')
    runs-on: macos-14
    concurrency:
      group: build-ios-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.version.outputs.TAG_NAME }}
      version_name: ${{ steps.version.outputs.VERSION_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17  (for KMP Gradle tasks)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Extract & inject version
        id: version
        run: |
          RAW=$(grep 'versionName\s*=' mobile-app/kotlin/app/build.gradle.kts | head -1 | awk -F'"' '{print $2}')
          BASE=$(echo "$RAW" | cut -d. -f1,2)
          VERSION_NAME="${BASE}.${{ github.run_number }}"
          TAG_NAME="v${VERSION_NAME}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME"         >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME"         >> $GITHUB_OUTPUT

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Grant gradlew permission
        run: chmod +x mobile-app/kotlin/gradlew

      - name: Build KMP iOS XCFramework
        working-directory: mobile-app/kotlin
        run: |
          ./gradlew :shared:assembleSharedReleaseXCFramework --no-daemon --stacktrace

      - name: Resolve Swift dependencies
        working-directory: mobile-app/kotlin/iosApp
        run: |
          if [ -f "iosApp.xcodeproj/project.pbxproj" ]; then
            xcodebuild -resolvePackageDependencies \
              -project iosApp.xcodeproj \
              -scheme iosApp \
              -destination "generic/platform=iOS"
          else
            echo "⚠️  Xcode project not found — skipping iOS build"
            exit 1
          fi

      - name: Set version in Info.plist
        run: |
          PLIST="mobile-app/kotlin/iosApp/iosApp/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST" || true
          fi

      - name: Build iOS app (unsigned — ad hoc)
        working-directory: mobile-app/kotlin/iosApp
        run: |
          if [ ! -f "iosApp.xcodeproj/project.pbxproj" ]; then
            echo "⚠️  Xcode project not found — skipping iOS build"
            exit 1
          fi
          xcodebuild archive \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/VidyaSchool.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates

      - name: Package Unsigned IPA
        run: |
          if [ ! -d "$RUNNER_TEMP/VidyaSchool.xcarchive" ]; then
            echo "❌ Archive not found — failing build"
            exit 1
          fi
          
          mkdir -p $RUNNER_TEMP/Payload
          cp -R "$RUNNER_TEMP/VidyaSchool.xcarchive/Products/Applications/iosApp.app" $RUNNER_TEMP/Payload/
          
          mkdir -p artifacts
          cd $RUNNER_TEMP
          zip -r "$GITHUB_WORKSPACE/artifacts/VidyaSchool-$TAG_NAME.ipa" Payload
          
          echo "Successfully packaged unsigned IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Android APK  (ubuntu runner)
  # ─────────────────────────────────────────────────────────────
  build-android:
    name: 🤖 Build Android APK
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[app-build]') ||
      contains(github.event.head_commit.message, '[android-build]') ||
      contains(github.event.head_commit.message, '[app-update]')
    runs-on: ubuntu-latest
    concurrency:
      group: build-android-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.version.outputs.TAG_NAME }}
      version_name: ${{ steps.version.outputs.VERSION_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Extract version name & tag
        id: version
        run: |
          RAW=$(grep 'versionName\s*=' mobile-app/kotlin/app/build.gradle.kts | head -1 | awk -F'"' '{print $2}')
          BASE=$(echo "$RAW" | cut -d. -f1,2)
          VERSION_NAME="${BASE}.${{ github.run_number }}"
          TAG_NAME="v${VERSION_NAME}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME"         >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME"         >> $GITHUB_OUTPUT

      - name: Grant gradlew permission
        run: chmod +x mobile-app/kotlin/gradlew

      - name: Patch version in build.gradle.kts
        run: |
          RAW=$(grep 'versionName\s*=' mobile-app/kotlin/app/build.gradle.kts | head -1 | awk -F'"' '{print $2}')
          sed -i "s/versionName = \"$RAW\"/versionName = \"$VERSION_NAME\"/" mobile-app/kotlin/app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/" mobile-app/kotlin/app/build.gradle.kts

      - name: Build debug APK
        working-directory: mobile-app/kotlin
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp mobile-app/kotlin/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/VidyaSchool-${{ env.TAG_NAME }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/VidyaSchool-${{ env.TAG_NAME }}.apk
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 3 — GitHub Release  (attach APK and/or IPA)
  # ─────────────────────────────────────────────────────────────
  create-release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ build-ios, build-android ]
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (needs.build-ios.result == 'success' || needs.build-android.result == 'success')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract release tag name
        run: |
          RAW=$(grep 'versionName\s*=' mobile-app/kotlin/app/build.gradle.kts | head -1 | awk -F'"' '{print $2}')
          BASE=$(echo "$RAW" | cut -d. -f1,2)
          VERSION_NAME="${BASE}.${{ github.run_number }}"
          TAG_NAME="v${VERSION_NAME}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME"         >> $GITHUB_ENV

      - name: Download Android APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/

      - name: Download iOS IPA
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets/

      - name: List release assets
        run: ls -lh release-assets/ || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete pre-existing release and tag if they exist to prevent build collision errors
          gh release delete "$TAG_NAME" -y --cleanup-tag || true

          # Build release notes
          NOTES="## VidyaSchool $TAG_NAME

          > Built automatically from commit \`${{ github.sha }}\`

          ### 📦 Downloads

          | Platform | File | How to install |
          |----------|------|----------------|
          | 🤖 Android | \`VidyaSchool-$TAG_NAME.apk\` | Download & install directly |
          | 🍎 iOS | \`VidyaSchool-$TAG_NAME.ipa\` | Install via AltStore / TestFlight |

          ### Android Install
          1. Download the APK below
          2. Enable \"Install from unknown sources\" in Settings
          3. Tap the APK to install

          ### iOS Install
          - **TestFlight**: Join the beta program
          - **AltStore**: Sideload the IPA using AltStore on your Mac/PC

          ---
          *The app will automatically detect this release and prompt users to update.*"

          # Collect assets
          ASSETS=()
          for f in release-assets/*; do
            if [ -f "$f" ]; then
              ASSETS+=("$f")
            fi
          done

          if [ ${#ASSETS[@]} -gt 0 ]; then
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --title "VidyaSchool $TAG_NAME" \
              --notes "$NOTES" \
              --target main
          else
            echo "⚠️ No release assets found to publish."
          fi

