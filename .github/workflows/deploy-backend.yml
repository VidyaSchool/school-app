name: Deploy Backend to AWS Lightsail

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"     # only runs when backend files change
      - "backend/**"          # legacy fallback
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: deploy-backend-lightsail
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH Deploy to Lightsail
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7

      # ── 2. SSH into Lightsail and deploy ────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            echo "=================================================="
            echo "🚀 Starting VidyaSchool Backend CI/CD Deploy"
            echo "=================================================="

            echo "📦 Ensuring remote origin is VidyaSchool/school-app..."
            cd /home/ubuntu/vidyaschool
            git remote set-url origin https://github.com/VidyaSchool/school-app.git
            git fetch origin main
            git reset --hard origin/main
            git pull origin main

            echo "🔧 Setting up backend directory and virtualenv..."
            # If old backend directory exists and is a real folder (not yet a symlink), migrate untracked files
            if [ -d "/home/ubuntu/vidyaschool/backend" ] && [ ! -L "/home/ubuntu/vidyaschool/backend" ]; then
              echo "Migrating server untracked files (.venv, .env, firebase-credentials.json) to apps/backend..."
              cp -rn /home/ubuntu/vidyaschool/backend/.* /home/ubuntu/vidyaschool/apps/backend/ 2>/dev/null || true
              cp -rn /home/ubuntu/vidyaschool/backend/* /home/ubuntu/vidyaschool/apps/backend/ 2>/dev/null || true
              rm -rf /home/ubuntu/vidyaschool/backend
            fi

            # Ensure backward-compatible symlink so systemd service vidyaschool-backend continues to work seamlessly
            ln -sfn /home/ubuntu/vidyaschool/apps/backend /home/ubuntu/vidyaschool/backend

            cd /home/ubuntu/vidyaschool/apps/backend

            if [ ! -f ".venv/bin/activate" ]; then
              echo "Creating fresh virtualenv in apps/backend..."
              python3 -m venv .venv
            fi

            source .venv/bin/activate

            echo "📥 Installing/updating dependencies..."
            pip install -q -r requirements.txt

            echo "🗄️ Syncing database schema with models..."
            python3 -c "from app.core.database import init_db; init_db(); print('Database schema and settings synced successfully')"

            echo "🔄 Restarting backend service..."
            sudo systemctl restart vidyaschool-backend

            echo "🩺 Verifying backend health..."
            if curl --retry 5 --retry-connrefused --retry-delay 2 -sf http://localhost:8000/api/health > /dev/null; then
              echo "✅ Backend is healthy and operational!"
            else
              echo "⚠️ Backend health check failed! Inspecting status:"
              sudo systemctl status vidyaschool-backend --no-pager -l
              exit 1
            fi

            echo "=================================================="
            echo "🎉 Backend & Database CI/CD Deployment complete!"
            echo "=================================================="

