name: Deploy Backend to AWS Lightsail

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"          # only runs when backend files change
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    name: SSH Deploy to Lightsail
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. SSH into Lightsail and deploy ────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            echo "=================================================="
            echo "🚀 Starting VidyaSchool Backend CI/CD Deploy"
            echo "=================================================="

            echo "📦 Ensuring remote origin is VidyaSchool/school-app..."
            cd /home/ubuntu/vidyaschool
            git remote set-url origin https://github.com/VidyaSchool/school-app.git
            git fetch origin main
            git reset --hard origin/main
            git pull origin main

            echo "🔧 Activating virtualenv..."
            cd /home/ubuntu/vidyaschool/backend
            source .venv/bin/activate

            echo "📥 Installing/updating dependencies..."
            pip install -q -r requirements.txt

            echo "🗄️ Syncing database schema with models..."
            python3 -c "from app.core.database import init_db; init_db(); print('Database schema and settings synced successfully')"

            echo "🔄 Restarting backend service..."
            sudo systemctl restart vidyaschool-backend

            echo "🩺 Verifying backend health..."
            if curl --retry 5 --retry-connrefused --retry-delay 2 -sf http://localhost:8000/api/health > /dev/null; then
              echo "✅ Backend is healthy and operational!"
            else
              echo "⚠️ Backend health check failed! Inspecting status:"
              sudo systemctl status vidyaschool-backend --no-pager -l
              exit 1
            fi

            echo "=================================================="
            echo "🎉 Backend & Database CI/CD Deployment complete!"
            echo "=================================================="

