<svg width="261" height="118" viewBox="0 0 261 118" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="chip-shadow" x="10" y="8" width="241" height="104" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Top Pins -->
  <rect x="54.5" y="0" width="8" height="14" rx="2" fill="#71717a"/>
  <rect x="78.5" y="0" width="8" height="14" rx="2" fill="#71717a"/>
  <rect x="102.5" y="0" width="8" height="14" rx="2" fill="#71717a"/>
  <rect x="126.5" y="0" width="8" height="14" rx="2" fill="#71717a"/>
  <rect x="150.5" y="0" width="8" height="14" rx="2" fill="#71717a"/>
  <rect x="174.5" y="0" width="8" height="14" rx="2" fill="#71717a"/>
  <rect x="198.5" y="0" width="8" height="14" rx="2" fill="#71717a"/>

  <!-- Bottom Pins (Silver Metallic) -->
  <rect id="chip-pin-1" x="54.5" y="98" width="8" height="14" rx="2" fill="#8e8e93"/>
  <rect id="chip-pin-2" x="78.5" y="98" width="8" height="14" rx="2" fill="#8e8e93"/>
  <rect id="chip-pin-3" x="102.5" y="98" width="8" height="14" rx="2" fill="#8e8e93"/>
  <rect id="chip-pin-4" x="126.5" y="98" width="8" height="14" rx="2" fill="#8e8e93"/>
  <rect id="chip-pin-5" x="150.5" y="98" width="8" height="14" rx="2" fill="#8e8e93"/>
  <rect id="chip-pin-6" x="174.5" y="98" width="8" height="14" rx="2" fill="#8e8e93"/>
  <rect id="chip-pin-7" x="198.5" y="98" width="8" height="14" rx="2" fill="#8e8e93"/>

  <!-- Left Pins -->
  <rect x="6" y="38" width="14" height="8" rx="2" fill="#71717a"/>
  <rect x="6" y="66" width="14" height="8" rx="2" fill="#71717a"/>

  <!-- Right Pins -->
  <rect x="241" y="38" width="14" height="8" rx="2" fill="#71717a"/>
  <rect x="241" y="66" width="14" height="8" rx="2" fill="#71717a"/>

  <!-- Chip IC Body -->
  <g filter="url(#chip-shadow)">
    <rect x="20" y="14" width="221" height="84" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  </g>

  <!-- Pin 1 Orientation Marker -->
  <circle cx="36" cy="30" r="3" fill="#3f3f46"/>

  <!-- Chip Minimal Monospace Typography -->
  <text x="130.5" y="53" text-anchor="middle" fill="#f4f4f5" font-size="12" font-weight="700" letter-spacing="2.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">VIDYA</text>
  <text x="130.5" y="68" text-anchor="middle" fill="#71717a" font-size="8" font-weight="500" letter-spacing="1.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ROBOTICS &amp; STEM</text>
</svg>
