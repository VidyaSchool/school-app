android.useAndroidX=true
android.enableJetifier=true
# Use system JAVA_HOME / Gradle Toolchain instead of hardcoded path
# org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+ParallelRefProcEnabled
kotlin.daemon.jvm.options=-Xmx2048m
kotlin.native.ignoreDisabledTargets=true

# Ultra-fast Gradle parallel execution & build caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# Kotlin incremental compilation optimizations
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.incremental.java=true
